name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # Creating the release and uploading its assets needs write access. Nothing
  # else here does, so the token gets nothing else.
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag, so it needs the whole history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
